services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitpay
      POSTGRES_PASSWORD: fitpay
      POSTGRES_DB: fitpay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpay"]
      interval: 2s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FITPAY_DATABASE_URL: postgresql+psycopg://fitpay:fitpay@db:5432/fitpay
      FITPAY_ADMIN_API_KEY: ${FITPAY_ADMIN_API_KEY:-change-me}
      FITPAY_PUBLIC_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
