[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitpay"
version = "0.1.0"
description = "Clients, packages and PayFast payments API for coaching and fitness businesses."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gareth Kriel" }]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.1,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "httpx2>=2.14,<3",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
fitpay = "fitpay.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Vercel: the FastAPI app to deploy (the other `app` objects are the command-line tool).
[tool.vercel]
entrypoint = "src.fitpay.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["fitpay"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
